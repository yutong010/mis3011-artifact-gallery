<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Artifact Gallery</title>
<meta name="description" content="Artifacts built and published by students of this course. Every entry links to something you can open.">
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='10'%20fill='%230b0b0e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<div class="wrap">

  <div class="lang-switch" role="group" aria-label="Language / 语言">
    <button type="button" id="langEn" class="lang-btn">EN</button>
    <button type="button" id="langZh" class="lang-btn">中文</button>
  </div>

  <header>
    <p class="kicker"><span class="dot"></span><span id="kicker-text"></span></p>
    <h1><span id="courseName"></span><br><span class="accent" id="tagline"></span></h1>
    <div class="meta">
      <span id="termLine"></span>
      <span id="cadence"></span>
    </div>
    <p class="intro" id="intro"></p>
  </header>

  <main id="list"></main>

  <footer>
    <div class="foot-cols">
      <p id="footBuilt" style="white-space:pre-line"></p>
    </div>
    <div class="foot-links">
      <a id="linkPast" href="#" target="_blank" rel="noopener"></a>
      <a id="linkSibling" href="#" target="_blank" rel="noopener" hidden></a>
    </div>
    <p class="standing" id="standing"></p>
  </footer>

</div>

<noscript>
  <p style="max-width:760px;margin:40px auto;color:#9c9ca6;font-family:sans-serif;text-align:center">
    This gallery needs JavaScript to display the artifact list.<br>
    本页需要启用 JavaScript 才能显示作品列表。
  </p>
</noscript>

<script src="data/config.js"></script>
<script src="data/artifacts.js"></script>
<script src="assets/render.js"></script>
</body>
</html>
